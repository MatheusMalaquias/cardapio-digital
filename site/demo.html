<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — Cardápio Digital</title>
<meta name="description" content="Demonstração interativa do cardápio digital com comanda por mesa. Dados de exemplo, sem servidor.">
<meta name="theme-color" content="#0C0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script>
  // Conteúdo só fica escondido enquanto as animações estiverem funcionando.
  document.documentElement.classList.add("js");
  addEventListener("load", function () {
    setTimeout(function () { if (!window.__animacaoOk) document.documentElement.classList.remove("js"); }, 2500);
  });
</script>
<link rel="stylesheet" href="demo.css?v=1">
</head>
<body>
<canvas id="fundo" aria-hidden="true"></canvas>
<div class="progresso" aria-hidden="true"></div>

<header id="topo">
  <div class="topo-linha">
    <p class="nome disp" id="nomeCafe"></p>
    <button class="btn-garcom chip" id="btnGarcom" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span id="txtGarcom">Chamar garçom</span>
    </button>
  </div>
  <div class="chips-wrap" id="chipsWrap">
    <div>
      <div class="abas-linha">
        <nav class="abas" id="abas" aria-label="Categorias"></nav>
        <button class="btn-filtro" id="btnFiltro" type="button" aria-label="Filtros de alergênicos" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
        </button>
      </div>
      <div class="filtros" id="filtros" role="group" aria-label="Filtros de alergênicos" hidden></div>
    </div>
  </div>
</header>

<main>
  <div class="hero-track" id="hero">
    <div class="hero-sticky">
      <div class="hero-nome"><h1 class="grad-text disp" id="heroNome"></h1></div>
      <div class="hero-narr">
        <p class="eyebrow"><span class="pulso" aria-hidden="true"></span> Demonstração · dados de exemplo</p>
        <h2 class="disp" aria-label="Peça direto da sua mesa, sem fila.">
          <span style="display:block" id="l1" aria-hidden="true"></span>
          <span class="grad-accent" style="display:block" id="l2" aria-hidden="true"></span>
        </h2>
        <ul class="feats">
          <li class="feat" style="--t:.55">Escolha no celular</li>
          <li class="feat" style="--t:.65">Acompanhe o preparo</li>
          <li class="feat" style="--t:.75">Pague no caixa</li>
        </ul>
        <div class="hero-dica">
          <button class="btn-ver brilho" id="btnVer" type="button">Ver cardápio ↓</button>
          <a class="sobre" href="index.html">← Sobre o projeto</a>
        </div>
      </div>
    </div>
  </div>
  <div id="menu"></div>
</main>

<div id="barra"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="dados.js"></script>
<script src="demo.js?v=1"></script>
</body>
</html>
